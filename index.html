<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>THRONEROOM '26 | Anmeldung</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="container">

    <section class="hero">

      <div class="cross">✝</div>

      <p class="small-title">DU BIST EINGELADEN</p>

      <h1>THRONEROOM <span>'26</span></h1>

      <p class="subtitle">Anmeldung</p>

      <p class="intro">
        Wir freuen uns, dich bei uns begrüßen zu dürfen.
        Bitte melde dich für Throneroom '26 an.
      </p>

    </section>


    <section class="registration-card">

      <h2>Anmeldung</h2>

      <p class="card-description">
        Bitte fülle die folgenden Angaben aus.
      </p>


      <form id="registrationForm">

        <div class="input-row">

          <div class="input-group">
            <label for="first_name">Vorname</label>

            <input
              type="text"
              id="first_name"
              name="first_name"
              placeholder="Dein Vorname"
              required
            >
          </div>


          <div class="input-group">
            <label for="surname">Nachname</label>

            <input
              type="text"
              id="surname"
              name="surname"
              placeholder="Dein Nachname"
              required
            >
          </div>

        </div>


        <div class="input-group">

          <label for="age">Alter</label>

          <input
            type="number"
            id="age"
            name="age"
            placeholder="Dein Alter"
            min="1"
            max="100"
            required
          >

        </div>


        <div class="input-group">

          <label for="telephone">Telefonnummer</label>

          <input
            type="tel"
            id="telephone"
            name="telephone"
            placeholder="+49 ..."
            required
          >

        </div>


        <div class="input-group">

          <label>Bereich</label>

          <div class="options">

            <label class="option">
              <input type="radio" name="department" value="Usher" required>
              <span>Ordnerdienst</span>
            </label>

            <label class="option">
              <input type="radio" name="department" value="Tech">
              <span>Technik</span>
            </label>

            <label class="option">
              <input type="radio" name="department" value="Media">
              <span>Medien</span>
            </label>

            <label class="option">
              <input type="radio" name="department" value="Choir">
              <span>Chor</span>
            </label>

            <label class="option">
              <input type="radio" name="department" value="Catering">
              <span>Catering</span>
            </label>

            <label class="option">
              <input type="radio" name="department" value="None of the above">
              <span>Keine der oben genannten</span>
            </label>

          </div>

        </div>


        <div class="input-group">

          <label>
            Kommst du alleine oder mit jemandem?
          </label>

          <div class="options">

            <label class="option">
              <input
                type="radio"
                name="attendance"
                value="Alone"
                required
                onchange="toggleCompanion(false)"
              >
              <span>Ich komme alleine</span>
            </label>

            <label class="option">
              <input
                type="radio"
                name="attendance"
                value="With someone"
                onchange="toggleCompanion(true)"
              >
              <span>Ich komme mit jemandem</span>
            </label>

          </div>

        </div>


        <div
          class="input-group companion-field"
          id="companionField"
          style="display: none;"
        >

          <label for="companion_name">
            Name der Begleitperson
          </label>

          <input
            type="text"
            id="companion_name"
            name="companion_name"
            placeholder="Name der Person, mit der du kommst"
          >

        </div>


        <button type="submit">
          JETZT ANMELDEN
        </button>

        <p id="message"></p>

      </form>

    </section>


    <footer>

      <p>THRONEROOM '26</p>

      <p>© 2026</p>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
